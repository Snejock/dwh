# Базовая конфигурация кластера Airflow на LocalExecutor с PostgreSQL.
#
# ВНИМАНИЕ: эта конфигурация — для локальной разработки. Не используйте её в продакшене.
#
# Конфигурация настраивается через переменные окружения или файл .env.
# Поддерживаются следующие переменные:
#
# AIRFLOW_IMAGE_NAME           - имя Docker-образа для запуска Airflow.
#                                По умолчанию: apache/airflow:3.3.1
# AIRFLOW__UID                 - UID пользователя в контейнерах Airflow.
#                                По умолчанию: 50000
# Эти настройки полезны в основном для автономного тестирования/пробного запуска Airflow.
#
# _AIRFLOW_WWW_USER_USERNAME   - имя пользователя-администратора (если запрашивается создание).
#                                По умолчанию: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - пароль пользователя-администратора (если запрашивается создание).
#                                По умолчанию: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - дополнительные PIP-зависимости, устанавливаемые при старте контейнеров.
#                                Используйте эту опцию ТОЛЬКО для быстрой проверки. Установка зависимостей
#                                при старте выполняется КАЖДЫЙ РАЗ при запуске сервиса.
#                                Правильный способ — собрать свой образ или расширить официальный,
#                                как описано здесь: https://airflow.apache.org/docs/docker-stack/build.html.
#                                По умолчанию: ''

---
x-airflow-common:
  &airflow-common
  build:
    context: .
    args:
      - AIRFLOW_IMAGE_NAME=${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.1}
      - DOCKER_GID=${DOCKER__GID:-986}
  profiles:
    - loki
  dns:
    - 8.8.8.8
    - 1.1.1.1
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@dwh-pg-1/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API_SECRET_KEY:?AIRFLOW__API_SECRET_KEY не задан в .env}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://dwh-airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # PYTHONDONTWRITEBYTECODE здесь намеренно НЕ ставим: байткод для всего
    # /home/airflow/.local уже закеширован на этапе сборки образа (см. Dockerfile,
    # шаг compileall) — исходники и .pyc из одного build-слоя, поэтому рантайм
    # ничего не дозаписывает. А без готового кеша каждый холодный интерпретатор
    # компилирует весь стек airflow/sqlalchemy с нуля — это 30-40+ секунд
    # CPU-времени на КАЖДЫЙ новый процесс (healthcheck, подпроцессы парсинга DAG'ов).
    HOME: /home/airflow
    # dbt-проекты монтируются по одному на каждый проект (см. volumes ниже:
    # /opt/dbt/<project> + /opt/dbt-profiles/<project>/profiles.yml)
  networks:
    - dwh-net
  # Ограничение размера json-file лога контейнера
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
  volumes:
    # logs/plugins — именованные volume (см. volumes: в конце файла).
    # Директории с правильными правами уже созданы в образе (см. Dockerfile),
    # Docker наполнит ими volume при первом использовании.
    - dwh-airflow-logs-data:/opt/airflow/logs
    - dwh-airflow-plugins-data:/opt/airflow/plugins
    # config — в репозитории (см. ./config/airflow.cfg), не в volume.
    - ./config:/opt/airflow/config
    # dags, plugins и dbt-проекты — по одному на каждый бизнес-проект, монтируем явно.
    # Добавляйте по четыре volume на новый проект (dags, plugins, dbt-код, profiles.yml).
    - ../../../signalfire/dwh/airflow/dags:/opt/airflow/dags/signalfire
    - ../../../signalfire/dwh/airflow/plugins:/opt/airflow/plugins/signalfire
    - ../../../signalfire/dwh/dbt:/opt/dbt/signalfire
    - ../../../signalfire/dwh/compose/dbt/config/profiles.yml:/opt/dbt-profiles/signalfire/profiles.yml
    - /var/run/docker.sock:/var/run/docker.sock
  # user: '${AIRFLOW__UID:-50000}:0'
  user: root  # нужны права root для доступа к docker.sock
  depends_on:
    &airflow-common-depends-on
    dwh-pg-1:
      condition: service_healthy

services:
  dwh-airflow-apiserver:
    <<: *airflow-common
    container_name: dwh-airflow-apiserver
    restart: unless-stopped
    command: api-server
    networks:
      - dwh-net
    ports:
      - '38090:8080'
    user: "${AIRFLOW__UID:-50000}"
    depends_on:
      <<: *airflow-common-depends-on
      dwh-airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/api/v2/version']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  dwh-airflow-scheduler:
    <<: *airflow-common
    container_name: dwh-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      dwh-airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8974/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  dwh-airflow-dag-processor:
    <<: *airflow-common
    container_name: dwh-airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      dwh-airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'airflow jobs check --job-type DagProcessorJob --hostname "$$(hostname)"']
      # timeout увеличен: healthcheck поднимает новый python-процесс и делает
      # `import airflow` с нуля — на этом стеке (даже с прогретым .pyc-кешем,
      # см. Dockerfile) это ощутимо небыстро, 5с было мало и check всегда падал
      # по таймауту, а не по факту.
      interval: 90s
      timeout: 60s
      retries: 3
      start_period: 60s

  dwh-airflow-triggerer:
    <<: *airflow-common
    container_name: dwh-airflow-triggerer
    command: triggerer
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      dwh-airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      # timeout увеличен: см. комментарий в healthcheck dwh-airflow-dag-processor.
      interval: 90s
      timeout: 60s
      retries: 3
      start_period: 60s

  dwh-airflow-init:
    <<: *airflow-common
    container_name: dwh-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW__UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW__UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW__UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW__UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW__UID}:0"
        echo
        chown -R "${AIRFLOW__UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW__UID}:0"
        echo
        chown -v -R "${AIRFLOW__UID}:0" /opt/airflow/{logs,dags,plugins}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins}

    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: '0:0'

  dwh-airflow-cli:
    <<: *airflow-common
    container_name: dwh-airflow-cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: '0'
    # обход проблемы с entrypoint. См.: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - tail -f /dev/null
    depends_on:
      <<: *airflow-common-depends-on

volumes:
  dwh-airflow-logs-data:
    name: dwh-airflow-logs-data
  dwh-airflow-plugins-data:
    name: dwh-airflow-plugins-data