# Базовая конфигурация кластера Airflow на CeleryExecutor с Redis и PostgreSQL.
#
# ВНИМАНИЕ: эта конфигурация — для локальной разработки. Не используйте её в продакшене.
#
# Конфигурация настраивается через переменные окружения или файл .env.
# Поддерживаются следующие переменные:
#
# AIRFLOW_IMAGE_NAME           - имя Docker-образа для запуска Airflow.
#                                По умолчанию: apache/airflow:3.3.1
# AIRFLOW_UID                  - UID пользователя в контейнерах Airflow.
#                                По умолчанию: 50000
# Эти настройки полезны в основном для автономного тестирования/пробного запуска Airflow.
#
# _AIRFLOW_WWW_USER_USERNAME   - имя пользователя-администратора (если запрашивается создание).
#                                По умолчанию: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - пароль пользователя-администратора (если запрашивается создание).
#                                По умолчанию: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - дополнительные PIP-зависимости, устанавливаемые при старте контейнеров.
#                                Используйте эту опцию ТОЛЬКО для быстрой проверки. Установка зависимостей
#                                при старте выполняется КАЖДЫЙ РАЗ при запуске сервиса.
#                                Правильный способ — собрать свой образ или расширить официальный,
#                                как описано здесь: https://airflow.apache.org/docs/docker-stack/build.html.
#                                По умолчанию: ''

---
x-airflow-common:
  &airflow-common
  build:
    context: .
    args:
      - AIRFLOW_IMAGE_NAME=${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.1}
      - DOCKER_GID=${DOCKER_GID:-986}
  profiles:
    - loki
  dns:
    - 8.8.8.8
    - 1.1.1.1
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@dwh-pg-1/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@dwh-pg-1/airflow
    # Используем общий Redis проекта (compose/redis), а не отдельный инстанс.
    # db 1, чтобы не пересекаться с redpanda-connect (использует db 0).
    AIRFLOW__CELERY__BROKER_URL: redis://:@dwh-rd-1:6379/1
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # dbt-проекты монтируются по одному на каждый проект (см. volumes ниже:
    # /opt/dbt/<project> + /opt/dbt-profiles/<project>/profiles.yml)
  networks:
    - dwh-net
  volumes:
    # logs/config/plugins — именованные volume (см. volumes: в конце файла).
    # Директории с правильными правами уже созданы в образе (см. Dockerfile),
    # Docker наполнит ими volume при первом использовании.
    - dwh-airflow-logs-data:/opt/airflow/logs
    - dwh-airflow-config-data:/opt/airflow/config
    - dwh-airflow-plugins-data:/opt/airflow/plugins
    # dags и dbt-проекты — по одному на каждый бизнес-проект, монтируем явно.
    # Добавляйте по три volume на новый проект (dags, dbt-код, profiles.yml).
    - ../../../signalfire/dwh/dags:/opt/airflow/dags/signalfire
    - ../../../signalfire/dwh/dbt:/opt/dbt/signalfire
    - ../../../signalfire/dwh/compose/dbt/config/profiles.yml:/opt/dbt-profiles/signalfire/profiles.yml
    - /var/run/docker.sock:/var/run/docker.sock
  # user: '${AIRFLOW_UID:-50000}:0'
  user: root  # нужны права root для доступа к docker.sock
  depends_on:
    &airflow-common-depends-on
    dwh-rd-1:
      condition: service_healthy
    dwh-pg-1:
      condition: service_healthy

services:
  # redis:
  #   # Redis ограничен версией 7.2-bookworm из-за изменения лицензии
  #   # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
  #   image: redis:7.2-bookworm
  #   container_name: dwh_redis
  #   restart: unless-stopped
  #   networks:
  #     - dwh-net
  #   expose:
  #     - 6379
  #   volumes:
  #     - dwh_redis_data:/data
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 30s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s

  airflow-apiserver:
    <<: *airflow-common
    container_name: dwh_airflow_apiserver
    restart: unless-stopped
    command: api-server
    networks:
      - dwh-net
    ports:
      - '38081:8080'
    user: "${AIRFLOW_UID:-50000}"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/api/v2/version']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    container_name: dwh_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8974/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: dwh_airflow_dag_processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'airflow jobs check --job-type DagProcessorJob --hostname "$$(hostname)"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-worker:
    <<: *airflow-common
    container_name: dwh_airflow_worker
    command: celery worker
    restart: unless-stopped
    environment:
      <<: *airflow-common-env
      # Нужно для корректного «тёплого» завершения celery-воркеров
      # См. https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: '0'
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-triggerer:
    <<: *airflow-common
    container_name: dwh_airflow_triggerer
    command: triggerer
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-init:
    <<: *airflow-common
    container_name: dwh_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}

    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: '0:0'

  airflow-cli:
    <<: *airflow-common
    container_name: dwh_airflow_cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: '0'
    # обход проблемы с entrypoint. См.: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - tail -f /dev/null
    depends_on:
      <<: *airflow-common-depends-on

volumes:
  # dwh_redis_data:
  #   name: dwh_redis_data
  dwh-airflow-logs-data:
    name: dwh-airflow-logs-data
  dwh-airflow-config-data:
    name: dwh-airflow-config-data
  dwh-airflow-plugins-data:
    name: dwh-airflow-plugins-data