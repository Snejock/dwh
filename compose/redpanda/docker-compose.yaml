services:
  dwh-rp-1:
    image: redpandadata/redpanda:v25.3.10
    container_name: dwh-rp-1
    restart: unless-stopped
    networks:
      - dwh-net
    dns:
      - 192.168.1.10
    ports:
      - "39092:19092"  # Kafka API
      - "39644:9644"   # Admin API
      - "38081:18081"  # Schema Registry
    volumes:
      - dwh-rp-1-data:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1               # Ограничение на использование ядер
      - --memory=1G           # Ограничение на использование памяти
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://dwh-rp-1:9092,external://192.168.1.15:39092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://dwh-rp-1:8082,external://192.168.1.15:38082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --set partition_autobalancing_mode=node_add
      - --set core_balancing_continuous=false
      - --set rbac_enabled=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9644/v1/status/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dwh-rp-connect:
    image: redpandadata/connect:4.86-ai
    container_name: dwh-rp-connect
    restart: unless-stopped
    depends_on:
      dwh-rp-1:
        condition: service_healthy
      dwh-pg-1:
        condition: service_healthy
    networks:
      - dwh-net
    ports:
      - "34195:4195"
    volumes:
      - ./config:/etc/redpanda-connect
      - ../../rpc:/streams:ro
      - ../../migrations:/migrations:ro
    environment:
      - PG_USER=${POSTGRES__USER}
      - PG_PASSWORD=${POSTGRES__PASSWORD}
      - PG_DATABASE=${POSTGRES__DATABASE}
      - PG_HOST=${POSTGRES__HOST}
      - PG_PORT=${POSTGRES__PORT}
      - DEEPSEEK_API_KEY=${DEEPSEEK__API_KEY}
      - GEONAMES_USERNAME=${GEONAMES__USERNAME}
      - MINIO_USER=${MINIO__USER}
      - MINIO_PASSWORD=${MINIO__PASSWORD}
      - MINIO_ENDPOINT=${MINIO__ENDPOINT}
      - MINIO_BUCKET_ACTOR_MEDIA=${MINIO__BUCKET_ACTOR_MEDIA}
      - MINIO_PUBLIC_BASE_URL=${MINIO__PUBLIC_BASE_URL}
    command: [
      "streams",
      "-w",
      "-o", "/etc/redpanda-connect/connect.yaml",
      "-r", "/etc/redpanda-connect/resources.yaml",
      "/streams"
    ]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Настройка retention политики для топика _schemas
  dwh-rp-schema-registry-init:
    image: redpandadata/redpanda:v25.3.10
    container_name: dwh-rp-schema-registry-init
    restart: "no"
    networks:
      - dwh-net
    depends_on:
      dwh-rp-1:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rpk topic create _schemas -p 1 -r 1 \
          -c cleanup.policy=compact \
          -c retention.ms=-1 \
          -c retention.bytes=-1 \
          -c retention.local.target.ms=-1 \
          -c retention.local.target.bytes=-1 \
          -X brokers=dwh-rp-1:9092 \
        || rpk topic alter-config _schemas \
          --set cleanup.policy=compact \
          --set retention.ms=-1 \
          --set retention.bytes=-1 \
          --set retention.local.target.ms=-1 \
          --set retention.local.target.bytes=-1 \
          -X brokers=dwh-rp-1:9092
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dwh-rp-console:
    image: redpandadata/console:v3.5.3
    container_name: dwh-rp-console
    restart: unless-stopped
    depends_on:
      dwh-rp-1:
        condition: service_healthy
      dwh-rp-schema-registry-init:
        condition: service_completed_successfully
    networks:
      - dwh-net
    # dns:
    #   - 192.168.1.10
    ports:
      - "38088:8080"
    volumes:
      - ./config/redpanda-console-config.yaml:/etc/redpanda/redpanda-console-config.yaml
    environment:
      CONFIG_FILEPATH: /etc/redpanda/redpanda-console-config.yaml
      REDPANDA_CONSOLE_ANALYTICS_ENABLED: "false"
      LOGIN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dwh-rp-1-data:
    name: dwh-rp-1-data
    external: true
