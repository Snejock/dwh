services:
  dwh-ch:
    image: clickhouse:26.7.5.10-jammy
    container_name: ${CLICKHOUSE__NODE_NAME}
    hostname: ${CLICKHOUSE__NODE_NAME}
    restart: unless-stopped
    profiles: [odin, loki]
    # host-сеть: контейнер слушает порты (8123/9000/...) напрямую на интерфейсе хоста,
    # без NAT/docker-proxy — минимальная задержка для межсерверных запросов кластера.
    # Работает только на Linux-хостах. ВАЖНО: теперь наружу открыты ВСЕ порты,
    # которые ClickHouse слушает по конфигу (не только явно проброшенные)
    network_mode: host
    extra_hosts:
      - 'odin:${CLICKHOUSE__ODIN_IP}'
      - 'loki:${CLICKHOUSE__LOKI_IP}'
    environment:
      # server_id для ClickHouse Keeper — свой на каждом узле, см. .env.odin/.env.loki
      - CLICKHOUSE_KEEPER_SERVER_ID=${CLICKHOUSE__KEEPER_SERVER_ID}
      - CLICKHOUSE_USER=${CLICKHOUSE__USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE__PASSWORD}
      # Официальный entrypoint образа (см. /entrypoint.sh внутри контейнера) при заданном
      # CLICKHOUSE_USER безусловно ПЕРЕЗАПИСЫВАЕТ config/users.d/default-user.xml на каждом
      # старте контейнера — сгенерированным шаблоном без named_collection_control и без
      # <grants> (access_management там всегда 0, если явно не задать
      # CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT). Это стирало любые ручные/закоммиченные правки
      # того файла при каждом restart — конкретно поэтому core не мог получить право на
      # CREATE NAMED COLLECTION (см. signalfire/dwh/migrations/ch/016_create_named_collection_core.sql).
      # SKIP_USER_SETUP отключает эту перезапись — users.d/default-user.xml из этого репозитория
      # используется как есть.
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ch-data:/var/lib/clickhouse
      - ch-logs:/var/log/clickhouse-server
      - ./config:/etc/clickhouse-server
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ch-data:
    name: ${CLICKHOUSE__NODE_NAME}-data
    external: false
  ch-logs:
    name: ${CLICKHOUSE__NODE_NAME}-logs
    external: false