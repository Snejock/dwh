name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy-loki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST_LOKI }}
          port: ${{ secrets.PORT_LOKI }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            if [ ! -d /media/data/projects/dwh/.git ]; then
              git clone git@github.com:Snejock/dwh.git /media/data/projects/dwh
            fi
            cd /media/data/projects/dwh
            git fetch origin main
            git reset --hard origin/main

  deploy-odin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST_ODIN }}
          port: ${{ secrets.PORT_ODIN }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            if [ ! -d /media/data/projects/dwh/.git ]; then
              git clone git@github.com:Snejock/dwh.git /media/data/projects/dwh
            fi
            cd /media/data/projects/dwh
            git fetch origin main
            git reset --hard origin/main
